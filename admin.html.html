<!doctype html>
<html lang="ko">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>우리 반 칭찬 레이스 - 관리자</title>
<style>
*{box-sizing:border-box}body{margin:0;background:#f6f1e7;color:#403a31;font-family:system-ui,-apple-system,"Noto Sans KR",sans-serif}
header{text-align:center;padding:23px 12px 8px}h1{margin:0;font-size:28px}header p{margin:6px;color:#8b8378}
.wrap{max-width:1050px;margin:auto;padding:12px}.grid{display:grid;grid-template-columns:1fr 1.25fr;gap:16px}.panel{background:#fff;border-radius:20px;padding:18px;box-shadow:0 5px 18px #0001}
h2{font-size:19px;margin:0 0 12px}input,select,button{font:inherit}input,select{width:100%;padding:10px;border:1px solid #ddd;border-radius:10px;margin-bottom:8px}
button{border:0;border-radius:10px;padding:10px 12px;font-weight:700;cursor:pointer;background:#e5efd9;margin:3px}.stamp{width:100%;text-align:left;background:#f0f5e9;border:1px solid #dbe6ce}.stamp strong{float:right}.danger{background:#eee}
.row{display:flex;align-items:center;gap:8px;padding:9px;background:#fafafa;border-radius:10px;margin:6px 0}.row b{flex:1}.tag{font-size:12px;background:#eee;padding:3px 7px;border-radius:7px}
.log{border-left:3px solid #b8cd99;background:#fafbf7;border-radius:8px;padding:8px 10px;margin:6px 0;font-size:13px}.log small{color:#8b8378}
.empty{color:#999;font-size:13px}.tools{margin-top:16px}.wide{width:100%}
</style></head>
<body>
<header><h1>⭐ 우리 반 칭찬 레이스 · 관리자</h1><p>학생을 선택하고 칭찬 도장을 눌러 주세요.</p></header>
<div class="wrap"><div class="grid">
<section class="panel">
<h2>👥 학생 등록</h2>
<input id="newName" placeholder="학생 이름">
<button onclick="add()" class="wide">학생 추가</button>
<div id="list"></div>
</section>

<section class="panel">
<h2>⭐ 칭찬 도장</h2>
<select id="who"></select>
<div id="stamps"></div>
</section>
</div>

<section class="panel tools">
<h2>📋 칭찬 기록</h2>
<select id="logWho" onchange="renderLogs()"></select>
<div id="logs"></div>
<button class="danger" onclick="undo()">마지막 도장 취소</button>
<button class="danger" onclick="resetAll()">전체 기록 초기화</button>
<p style="font-size:12px;color:#8b8378">발표 자진해서 하기는 수학 시간 발표를 제외하고 적용합니다. 탐구 모의고사는 +2칸입니다.</p>
</section>
</div>

<script>
const KEY="classPraiseRace_v3";
const HISTORY=KEY+"_history";
const praise=[
 ["숙제하기",1],
 ["열품타 5시간",1],
 ["발표 자진해서 하기 (수학 제외)",1],
 ["탐구 모의고사",2],
 ["안 온 사람 청소해주기",1],
 ["인사왕 뽑기",1],
 ["1달에 한 번 뽑기",1],
 ["대답왕",1],
 ["개근왕 (1달)",1]
];
let data={},history=[];
const EMOJIS=["🐰","🐻","🐸","🐱","🐶","🐼","🦊","🐯","🐨","🐹","🐥","🐵","🐙","🦄","🐳","🐧"];

function load(){try{data=JSON.parse(localStorage.getItem(KEY)||"{}");history=JSON.parse(localStorage.getItem(HISTORY)||"[]")}catch(e){data={};history=[]}}
function save(){localStorage.setItem(KEY,JSON.stringify(data));localStorage.setItem(HISTORY,JSON.stringify(history));render()}
function esc(s){return String(s).replace(/[&<>"']/g,m=>({"&":"&amp;","<":"&lt;",">":"&gt;",'"':"&quot;","'":"&#39;"}[m]))}
function add(){const n=document.getElementById("newName").value.trim();if(!n)return;if(data[n]){alert("이미 등록된 학생입니다.");return}data[n]={pos:0,icon:Object.keys(data).length%EMOJIS.length};document.getElementById("newName").value="";save()}
function give(step,label){
 const n=document.getElementById("who").value;if(!n)return;
 const old=Number(data[n].pos)||0,newPos=Math.min(49,old+step);
 data[n].pos=newPos;
 history.push({name:n,old,step,label,time:new Date().toLocaleString("ko-KR")});
 save();
 if(newPos===49)alert("🏆 "+n+" 학생이 GOAL에 도착했습니다!");
}
function undo(){
 if(!history.length){alert("취소할 기록이 없습니다.");return}
 const h=history.pop(); if(data[h.name])data[h.name].pos=h.old;save();
}
function removeStudent(n){if(confirm(n+" 학생을 삭제할까요?")){delete data[n];history=history.filter(h=>h.name!==n);save()}}
function resetAll(){if(!confirm("모든 학생의 이동 기록과 칭찬 기록을 초기화할까요?"))return;Object.keys(data).forEach(n=>data[n].pos=0);history=[];save()}
function render(){
 load();
 const who=document.getElementById("who"), old=who.value;who.innerHTML="";
 Object.entries(data).forEach(([n,s])=>{const o=document.createElement("option");o.value=n;o.textContent=n+" ("+(s.pos||0)+"칸)";who.appendChild(o)});
 if(data[old])who.value=old;
 document.getElementById("stamps").innerHTML=praise.map(([l,s])=>`<button class="stamp" onclick='give(${s},${JSON.stringify(l)})'>🟡 ${esc(l)} <strong>+${s}칸</strong></button>`).join("");
 const list=document.getElementById("list");
 list.innerHTML=Object.entries(data).map(([n,s])=>`<div class="row"><b>${EMOJIS[(s.icon||0)%EMOJIS.length]} ${esc(n)}</b><span class="tag">${s.pos||0}/49</span><button onclick='removeStudent(${JSON.stringify(n)})'>삭제</button></div>`).join("")||"<p class='empty'>학생을 먼저 등록해 주세요.</p>";
 const lw=document.getElementById("logWho"), oldL=lw.value;lw.innerHTML="<option value='__all__'>전체 학생</option>";
 Object.keys(data).forEach(n=>{const o=document.createElement("option");o.value=n;o.textContent=n;lw.appendChild(o)});if(oldL&&([...lw.options].some(o=>o.value===oldL)))lw.value=oldL;
 renderLogs();
}
function renderLogs(){
 load();const who=document.getElementById("logWho").value;
 const logs=history.slice().reverse().filter(h=>who==="__all__"||h.name===who);
 document.getElementById("logs").innerHTML=logs.length?logs.map(h=>`<div class="log"><b>${EMOJIS[(data[h.name]?.icon||0)%EMOJIS.length]} ${esc(h.name)}</b> — ${esc(h.label)} <b>+${h.step}칸</b><br><small>${esc(h.time)} · ${h.old}칸 → ${h.old+h.step>49?49:h.old+h.step}칸</small></div>`).join(""):"<p class='empty'>아직 칭찬 기록이 없습니다.</p>";
}
window.addEventListener("storage",render);render();
</script>
</body></html>
