
<!doctype html>
<html lang="ko">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>우리 반 칭찬 레이스 - 관리자</title>
<style>
*{box-sizing:border-box}
body{margin:0;background:#f6f1e7;color:#403a31;font-family:system-ui,-apple-system,"Noto Sans KR",sans-serif}
header{text-align:center;padding:23px 12px 8px}
h1{margin:0;font-size:28px}
header p{margin:6px;color:#8b8378}
.wrap{max-width:1050px;margin:auto;padding:12px}
.grid{display:grid;grid-template-columns:1fr 1.25fr;gap:16px}
.panel{background:#fff;border-radius:20px;padding:18px;box-shadow:0 5px 18px #0001}
h2{font-size:19px;margin:0 0 12px}
input,select,button{font:inherit}
input,select{width:100%;padding:10px;border:1px solid #ddd;border-radius:10px;margin-bottom:8px}
button{border:0;border-radius:10px;padding:10px 12px;font-weight:700;cursor:pointer;background:#e5efd9;margin:3px}
.stamp{width:100%;text-align:left;background:#f0f5e9;border:1px solid #dbe6ce}
.stamp strong{float:right}.danger{background:#eee}
.row{display:flex;align-items:center;gap:8px;padding:9px;background:#fafafa;border-radius:10px;margin:6px 0}
.row b{flex:1}.tag{font-size:12px;background:#eee;padding:3px 7px;border-radius:7px}
.log{border-left:3px solid #b8cd99;background:#fafbf7;border-radius:8px;padding:8px 10px;margin:6px 0;font-size:13px}
.log small{color:#8b8378}.empty{color:#999;font-size:13px}
.tools{margin-top:16px}.wide{width:100%}
#status{font-size:12px;color:#777;overflow-wrap:anywhere}
@media(max-width:650px){.grid{grid-template-columns:1fr}}
</style>
</head>
<body>
<header>
<h1>⭐ 우리 반 칭찬 레이스 · 관리자</h1>
<p>학생을 선택하고 칭찬 도장을 눌러 주세요.</p>
</header>
<div class="wrap">
<div class="grid">
<section class="panel">
<h2>👥 학생 등록</h2>
<input id="newName" placeholder="학생 이름" maxlength="30">
<button onclick="add()" class="wide">학생 추가</button>
<div id="list"></div>
</section>
<section class="panel">
<h2>⭐ 칭찬 도장</h2>
<select id="who"><option value="">학생 선택</option></select>
<div id="stamps"></div>
</section>
</div>
<section class="panel tools">
<h2>📋 칭찬 기록</h2>
<select id="logWho" onchange="renderLogs()"></select>
<div id="logs"></div>
<button class="danger" onclick="undo()">마지막 도장 취소</button>
<button class="danger" onclick="resetAll()">전체 기록 초기화</button>
<p style="font-size:12px;color:#8b8378">수학 시간 발표는 제외합니다. 탐구 모의고사는 +2칸입니다.</p>
<p id="status">Firebase 연결 확인 중...</p>
</section>
</div>
<script>
const DB_URL="https://classmate-4e263-default-rtdb.firebaseio.com";
const KEY="classPraiseRace_v3";
const HISTORY=KEY+"_history";
const praise=[
 ["숙제하기",1],
 ["열품타 5시간",1],
 ["발표 자진해서 하기 (수학 제외)",1],
 ["탐구 모의고사",2],
 ["안 온 사람 청소해주기",1],
 ["인사왕 뽑기",1],
 ["1달에 한 번 뽑기",1],
 ["대답왕",1],
 ["개근왕 (1달)",1]
];
const EMOJIS=["🐰","🐻","🐸","🐱","🐶","🐼","🦊","🐯","🐨","🐹","🐥","🐵","🐙","🦄","🐳","🐧"];
let data={},history=[],busy=false,lastSync=0;

function status(t){document.getElementById("status").textContent=t}
function esc(s){return String(s??"").replace(/[&<>"']/g,m=>({"&":"&amp;","<":"&lt;",">":"&gt;",'"':"&quot;","'":"&#39;"}[m]))}

async function request(path="",options={}){
 const r=await fetch(DB_URL+"/"+path+".json",{cache:"no-store",...options});
 const t=await r.text();
 if(!r.ok)throw new Error("HTTP "+r.status+" "+t);
 return t?JSON.parse(t):null;
}
async function syncRemote(){
 if(busy)return;
 try{
  const root=await request();
  data=root&&root[KEY]&&typeof root[KEY]==="object"?root[KEY]:{};
  history=Array.isArray(root&&root[HISTORY])?root[HISTORY]:[];
  lastSync=Date.now();
  render();
  status("Firebase 연결됨 · 마지막 확인 "+new Date().toLocaleTimeString("ko-KR"));
 }catch(e){
  console.error(e);
  status("연결 실패: "+e.message);
 }
}
async function save(){
 if(busy)return;
 busy=true;
 status("Firebase에 저장 중...");
 try{
  const payload={};
  payload[KEY]=data;
  payload[HISTORY]=history;
  await request("",{
   method:"PATCH",
   headers:{"Content-Type":"application/json"},
   body:JSON.stringify(payload)
  });
  lastSync=Date.now();
  render();
  status("저장 완료 · 다른 기기에도 반영될 수 있습니다.");
 }catch(e){
  console.error(e);
  status("저장 실패: "+e.message);
  alert("저장 실패: "+e.message);
 }finally{
  busy=false;
 }
}
function add(){
 const input=document.getElementById("newName");
 const n=input.value.trim();
 if(!n)return alert("학생 이름을 입력해 주세요.");
 if(data[n])return alert("이미 등록된 학생입니다.");
 data[n]={pos:0,icon:Object.keys(data).length%EMOJIS.length};
 history.push({name:n,label:"학생 등록",step:0,old:0,time:new Date().toLocaleString("ko-KR"),type:"add"});
 input.value="";
 save();
}
function give(step,label){
 const n=document.getElementById("who").value;
 if(!n||!data[n])return alert("먼저 학생을 선택해 주세요.");
 const old=Number(data[n].pos)||0;
 const newPos=Math.min(49,old+step);
 data[n].pos=newPos;
 history.push({name:n,old,step,label,time:new Date().toLocaleString("ko-KR"),type:"praise"});
 save();
 if(newPos===49)alert("🏆 "+n+" 학생이 GOAL에 도착했습니다!");
}
function removeStudent(n){
 if(!confirm(n+" 학생을 삭제할까요?"))return;
 delete data[n];
 history.push({name:n,label:"학생 삭제",step:0,old:0,time:new Date().toLocaleString("ko-KR"),type:"delete"});
 save();
}
function undo(){
 if(!history.length)return alert("취소할 기록이 없습니다.");
 if(!confirm("마지막 기록을 취소할까요?"))return;
 const h=history.pop();
 if(h.type==="praise"&&data[h.name])data[h.name].pos=h.old;
 else if(h.type==="add")delete data[h.name];
 save();
}
function resetAll(){
 if(!confirm("모든 학생의 칸과 칭찬 기록을 초기화할까요?"))return;
 Object.keys(data).forEach(n=>data[n].pos=0);
 history=[];
 history.push({name:"전체",label:"전체 기록 초기화",step:0,old:0,time:new Date().toLocaleString("ko-KR"),type:"reset"});
 save();
}
function render(){
 const who=document.getElementById("who"),old=who.value;
 who.innerHTML='<option value="">학생 선택</option>';
 Object.entries(data).sort((a,b)=>a[0].localeCompare(b[0],"ko")).forEach(([n,s])=>{
  const o=document.createElement("option");
  o.value=n;o.textContent=n+" ("+(Number(s.pos)||0)+"칸)";
  who.appendChild(o);
 });
 if(data[old])who.value=old;

 document.getElementById("stamps").innerHTML=praise.map(([label,step])=>
  `<button class="stamp" onclick='give(${step},${JSON.stringify(label)})'>🟡 ${esc(label)} <strong>+${step}칸</strong></button>`
 ).join("");

 document.getElementById("list").innerHTML=Object.entries(data).sort((a,b)=>a[0].localeCompare(b[0],"ko")).map(([n,s])=>
  `<div class="row"><b>${EMOJIS[(Number(s.icon)||0)%EMOJIS.length]} ${esc(n)}</b><span class="tag">${Number(s.pos)||0}/49</span><button onclick="removeStudent(${JSON.stringify(n)})">삭제</button></div>`
 ).join("")||'<p class="empty">학생을 먼저 등록해 주세요.</p>';

 const lw=document.getElementById("logWho"),oldL=lw.value;
 lw.innerHTML='<option value="__all__">전체 학생</option>';
 Object.keys(data).sort((a,b)=>a.localeCompare(b,"ko")).forEach(n=>{
  const o=document.createElement("option");o.value=n;o.textContent=n;lw.appendChild(o);
 });
 if(oldL&&[...lw.options].some(o=>o.value===oldL))lw.value=oldL;
 renderLogs();
}
function renderLogs(){
 const who=document.getElementById("logWho").value;
 const logs=history.slice().reverse().filter(h=>who==="__all__"||h.name===who);
 document.getElementById("logs").innerHTML=logs.length?logs.map(h=>
  `<div class="log"><b>${esc(h.name)}</b> — ${esc(h.label)} ${h.type==="praise"?`<b>+${h.step}칸</b>`:""}<br><small>${esc(h.time)}${h.type==="praise"?` · ${h.old}칸 → ${Math.min(49,h.old+h.step)}칸`:""}</small></div>`
 ).join(""):'<p class="empty">아직 칭찬 기록이 없습니다.</p>';
}
syncRemote();
setInterval(syncRemote,3000);
</script>
</body>
</html>
